<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="author" content="John Jenly Tirazona">
<meta name="description" content="Plan your Bohol trip with this easy tool.">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta property="og:title" content="Discover Bohol">
<meta property="og:description" content="Planning page Explore the beauty of Bohol.">
<meta property="og:image" content="images/hero.jpg">
<meta property="og:url" content="https://johntirazona.github.io/wdd231/final/plan.html">
<meta property="og:type" content="website">

<link rel="stylesheet" href="styles/normaliza.css">
<link rel="stylesheet" href="styles/small.css">
<link rel="stylesheet" href="styles/large.css">
<script type="module" src="scripts/main.js"></script>
<script src="scripts/dates.js" defer></script>

<title>Plan Trip - Discover Bohol</title>
</head>
<body>

<header>
  <div class="logo-area">
      <img src="images/logo.png" alt="Discover Bohol Logo">
  </div>
  <h1>Discover Bohol</h1>
  <button id="menu">☰</button>
  <nav>
    <a href="index.html">Home</a>
    <a href="destinations.html">Destinations</a>
    <a href="plan.html">Plan Trip</a>
  </nav>
</header>

<main>
<section class="plan-trip">
  <h2>Plan Your Trip</h2>
  <form id="trip-form">
    <label for="destination">Choose a destination:</label>
    <select id="destination" name="destination" required>
      <option value="">Select Destination</option>
      <option value="Chocolate Hills">Chocolate Hills</option>
      <option value="Panglao Island">Panglao Island</option>
      <option value="Tarsier Sanctuary">Tarsier Sanctuary</option>
      <option value="Loboc River Cruise">Loboc River Cruise</option>
      <option value="Baclayon Church">Baclayon Church</option>
      <option value="Hinagdanan Cave">Hinagdanan Cave</option>
      <option value="Alona Beach">Alona Beach</option>
      <option value="Man-Made Forest">Man-Made Forest</option>
      <option value="Blood Compact Shrine">Blood Compact Shrine</option>
      <option value="Anda Beach">Anda Beach</option>
      <option value="Danao Adventure Park">Danao Adventure Park</option>
      <option value="Sevilla Hanging Bridge">Sevilla Hanging Bridge</option>
      <option value="Balicasag Island">Balicasag Island</option>
      <option value="Bohol Bee Farm">Bohol Bee Farm</option>
      <option value="Mag-Aso Falls">Mag-Aso Falls</option>
    </select>

    <label for="date">Select date of trip:</label>
    <input type="date" id="date" name="date" required>

    <label for="guests">Number of guests:</label>
    <input type="number" id="guests" name="guests" min="1" max="20" required>

    <button type="submit">Plan My Trip</button>
  </form>

  <div id="trip-summary"></div>
</section>
</main>

<footer>
  <div class="footer-left">
    <h2>Discover Bohol</h2>
    <p>Bohol Island, Philippines</p>
    <p>Email: info@discoverbohol.org</p>
    <p>Phone: (032) 555-6789</p>
  </div>

  <div class="footer-center">
    <p>© <span id="year"></span> John Jenly Tirazona | WDD 231</p>
    <p id="lastModified"></p>
  </div>

  <div class="footer-right social">
    <a href="https://facebook.com" target="_blank" aria-label="Facebook">
      <img src="images/facebook.svg" alt="Facebook icon">
    </a>
    <a href="https://github.com/yourusername" target="_blank" aria-label="GitHub">
      <img src="images/github.svg" alt="GitHub icon">
    </a>
    <a href="https://linkedin.com" target="_blank" aria-label="LinkedIn">
      <img src="images/linkedin.svg" alt="LinkedIn icon">
    </a>
  </div>
</footer>

<script>
const form = document.getElementById("trip-form");
const summary = document.getElementById("trip-summary");

form.addEventListener("submit", e => {
  e.preventDefault();
  const dest = form.destination.value;
  const date = form.date.value;
  const guests = form.guests.value;

  summary.innerHTML = `
    <h3>Trip Summary</h3>
    <p>Destination: <strong>${dest}</strong></p>
    <p>Date: <strong>${date}</strong></p>
    <p>Guests: <strong>${guests}</strong></p>
    <p>Thank you! Your trip to ${dest} is now planned!</p>
  `;
});
</script>

</body>
</html>
